var CATS = [
  ['all', '全部档案'], ['server', '服务端插件'], ['astrbot', 'ASTRBOT 插件'],
  ['org', '组织'], ['platform', '平台']
];
var DOT = { ok: 'dot--ok', off: 'dot--off', maint: '', wait: 'dot--wait' };

var main = document.getElementById('os-main');
var curCat = 'all';
var curTab = 'overview';

/* ===== 时钟 ===== */
function tickClock() {
  var d = new Date();
  var s = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(function (n) { return String(n).padStart(2, '0'); }).join(':');
  ['clock', 'foot-clock'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = s;
  });
}
tickClock();
setInterval(tickClock, 1000);
document.getElementById('rec-count').textContent = String(FILES.length).padStart(3, '0');

/* ===== 目录视图 ===== */
function rowHTML(f) {
  return '<a class="dir-row" href="#/' + f.slug + '">' +
    '<span class="dir-no">' + f.no + '</span>' +
    '<span class="dir-name"><b>' + f.name + '</b><span>' + f.en + '</span></span>' +
    '<span class="dir-dept">' + f.dept + '</span>' +
    '<span class="dir-status"><span class="dot ' + DOT[f.status] + '"></span>' + f.statusText + '</span>' +
    '<span class="dir-go" aria-hidden="true">↗</span>' +
    '</a>';
}

function renderIndex() {
  var q = (document.getElementById('dir-q') && document.getElementById('dir-q').value.trim().toLowerCase()) || '';
  var rows = FILES.filter(function (f) {
    if (curCat !== 'all' && f.cat !== curCat) return false;
    if (!q) return true;
    return (f.name + ' ' + f.en + ' ' + f.zh + ' ' + f.dept).toLowerCase().indexOf(q) !== -1;
  });
  var tabs = CATS.map(function (c) {
    return '<button type="button" data-cat="' + c[0] + '" aria-pressed="' + (curCat === c[0]) + '">' + c[1] + '</button>';
  }).join('');
  main.innerHTML =
    '<div class="dir view">' +
    '<div class="dir-head"><h2>ARCHIVE INDEX</h2><span class="zh">内部档案索引</span></div>' +
    '<div class="dir-search"><span class="glyph" aria-hidden="true">⌕</span>' +
    '<input id="dir-q" type="search" placeholder="检索编号、名称或类别" aria-label="检索档案" value="' + q.replace(/"/g, '&quot;') + '" />' +
    '<span class="esc"><kbd>ESC</kbd></span></div>' +
    '<div class="dir-tabs" role="group" aria-label="类别筛选">' + tabs + '</div>' +
    '<div class="dir-cols" aria-hidden="true"><span>FILE / 编号</span><span>ARCHIVE / 档案</span><span>DEPARTMENT / 类别</span><span>STATUS / 状态</span><span></span></div>' +
    (rows.length ? rows.map(rowHTML).join('') : '<p class="dir-empty">未检索到匹配的档案。</p>') +
    '</div>';
  var input = document.getElementById('dir-q');
  input.addEventListener('input', renderIndex);
  main.querySelectorAll('.dir-tabs button').forEach(function (b) {
    b.addEventListener('click', function () { curCat = b.getAttribute('data-cat'); renderIndex(); });
  });
  if (q) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

/* ===== 详情视图 ===== */
function renderDoc(f) {
  document.getElementById('tool-index').classList.add('is-here');
  var meta = f.meta.map(function (m) {
    return '<div><div class="k">' + m[0] + '</div><div class="v">' + m[1] + '</div></div>';
  }).join('');
  var links = f.links.map(function (l) {
    return '<a class="side-link" href="' + l[1] + '"' + (l[1].indexOf('http') === 0 ? ' target="_blank" rel="noreferrer"' : '') + '>' + l[0] + '</a>';
  }).join('');
  var notes = f.notes.map(function (n, i) {
    return '<li><span class="no">' + String(i + 1).padStart(2, '0') + '</span><span>' + n + '</span></li>';
  }).join('');
  var chart = f.chart
    ? '<figure class="doc-chart"><img src="' + f.chart.src + '" alt="' + f.chart.alt + '" loading="lazy" /><figcaption>' + f.chart.cap + '</figcaption></figure>'
    : '';
  var overviewHTML =
    (f.overview.length > 1 ? '' : '<p class="doc-lede">ABSTRACT / 摘要</p>') +
    f.overview.map(function (p) { return '<p>' + p + '</p>'; }).join('');
  var notesHTML = '<p class="doc-lede">RECORDS / 记录</p><ul class="doc-list">' + notes + '</ul>' + chart;
  var linksHTML = '<p class="doc-lede">REFERENCE / 链接</p><div class="doc-list">' +
    f.links.map(function (l) {
      return '<a class="side-link" style="margin:10px 0" href="' + l[1] + '"' + (l[1].indexOf('http') === 0 ? ' target="_blank" rel="noreferrer"' : '') + '>' + l[0] + '</a>';
    }).join(' ') + '</div>';
  var tabs = [['overview', '01', '概述'], ['notes', '02', '记录'], ['links', '03', '链接']];
  var tabHTML = tabs.map(function (t) {
    return '<button type="button" data-tab="' + t[0] + '" aria-pressed="' + (curTab === t[0]) + '"><span class="no">' + t[1] + '</span>' + t[2] + '</button>';
  }).join('');
  var panels = { overview: overviewHTML, notes: notesHTML, links: linksHTML };

  main.innerHTML =
    '<div class="doc view">' +
    '<a class="doc-back" href="#/">←&nbsp;&nbsp;ARCHIVE INDEX <kbd>ESC</kbd></a>' +
    '<div class="doc-grid">' +
    '<aside class="doc-side">' +
    '<div class="no">NO.' + f.no + '</div>' +
    '<div class="db">INTERNAL DATABASE</div>' +
    '<div class="status"><span class="dir-status"><span class="dot ' + DOT[f.status] + '"></span>' + f.statusText + '</span></div>' +
    '<div class="side-links">' + links + '</div>' +
    '</aside>' +
    '<div class="doc-body">' +
    '<div class="doc-fileline"><span>FILE ' + f.no + '</span><span>REFERENCE AREA</span></div>' +
    '<h2 class="doc-title">' + f.name + '</h2>' +
    '<div class="doc-zh"><span>' + f.zh + '</span><span class="tag">' + f.en + '</span></div>' +
    '<div class="doc-rule"></div>' +
    '<div class="doc-meta">' + meta + '</div>' +
    '<div class="doc-tabs" role="group" aria-label="档案分区">' + tabHTML + '</div>' +
    '<div class="doc-panel" id="doc-panel">' + panels[curTab] + '</div>' +
    '<div class="doc-actions">' +
    '<a class="kbar" href="' + f.action.href + '"' + (f.action.href.indexOf('http') === 0 ? ' target="_blank" rel="noreferrer"' : '') + '><span>' + f.action.label + '</span><span class="zh">' + f.action.zh + '</span></a>' +
    '</div>' +
    '</div></div></div>';

  main.querySelectorAll('.doc-tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      curTab = b.getAttribute('data-tab');
      main.querySelectorAll('.doc-tabs button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      document.getElementById('doc-panel').innerHTML = panels[curTab];
    });
  });
}

/* ===== 路由 ===== */
function fileBySlug(slug) {
  return FILES.filter(function (f) { return f.slug === slug; })[0];
}
function render() {
  var slug = location.hash.replace(/^#\//, '');
  var f = fileBySlug(slug);
  if (f) { renderDoc(f); document.title = f.name + ' — DNT_OF Archive'; }
  else { curTab = 'overview'; renderIndex(); document.title = 'DNT_OF — Archive Index'; }
}
window.addEventListener('hashchange', render);

/* ===== 键盘 ===== */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var q = document.getElementById('dir-q');
    if (q && document.activeElement === q && q.value) { q.value = ''; renderIndex(); return; }
    if (location.hash && location.hash !== '#/') location.hash = '#/';
  }
  if ((e.key === 'i' || e.key === 'I' || e.key === '/') && !/input|textarea/i.test(document.activeElement.tagName)) {
    if (location.hash && location.hash !== '#/') location.hash = '#/';
    else { var s = document.getElementById('dir-q'); if (s) { e.preventDefault(); s.focus(); } }
  }
});

render();
</script>

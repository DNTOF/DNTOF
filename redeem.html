<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DNT_OF Redeem Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root {
--bg:#ECE9E0;--raised:#F5F3EC;--card:#FFFFFF;--ink:#141413;
--ink2:#6B6860;--ink3:#9C998F;--accent:#D97757;--accent-hover:#C0684A;
--accent-light:rgba(217,119,87,0.12);--border:#D8D5CC;--border2:#E6E3DA;
--err:#C0453A;--err-bg:rgba(192,69,58,0.08);--ok:#4A7C59;--ok-bg:rgba(74,124,89,0.08);
--display:'Lora',serif;--heading:'Poppins',sans-serif;
--body:'Noto Sans SC','Poppins',sans-serif;--mono:'Courier New',monospace;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;
--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
--fast:150ms;--norm:250ms;--ease:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--bg);color:var(--ink);font-family:var(--body);
min-height:100vh;overflow-x:hidden;line-height:1.6;position:relative;
}
body::before{
content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse 70% 50% at 10% 20%,rgba(217,119,87,0.07) 0%,transparent 60%),
radial-gradient(ellipse 60% 40% at 90% 80%,rgba(106,155,204,0.05) 0%,transparent 50%);
}
.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:var(--s12) var(--s6) var(--s16)}
.header{text-align:center;margin-bottom:var(--s12);animation:fadeUp .8s var(--ease) both}
.header h1{font-family:var(--display);font-size:clamp(2rem,5vw,2.8rem);font-weight:700;letter-spacing:-.02em;margin-bottom:var(--s2)}
.header h1 span{color:var(--accent)}
.header p{font-size:.95rem;color:var(--ink2);max-width:440px;margin:0 auto}
.card{
background:var(--card);border-radius:var(--r-xl);padding:var(--s10);
box-shadow:0 2px 20px rgba(0,0,0,.06);border:1px solid var(--border2);
animation:fadeUp .8s var(--ease) .1s both;position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
background:linear-gradient(90deg,var(--accent),#E8927A,var(--accent));opacity:.6}
.form-group{margin-bottom:var(--s6)}
.form-group:last-of-type{margin-bottom:0}
label{display:block;font-family:var(--heading);font-size:.78rem;font-weight:600;color:var(--ink2);margin-bottom:var(--s2);letter-spacing:.03em;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media(max-width:480px){.row{grid-template-columns:1fr}}
.sel-wrp{position:relative}
.sel-wrp::after{content:'\25BE';position:absolute;right:var(--s4);top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;font-size:.85rem}
select,input[type="text"]{width:100%;padding:var(--s3) var(--s4);font-family:var(--body);font-size:.95rem;color:var(--ink);
background:var(--raised);border:1.5px solid var(--border);border-radius:var(--r-sm);outline:none;
transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);-webkit-appearance:none;appearance:none}
select{padding-right:var(--s10);cursor:pointer}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.code-input{font-family:var(--mono);letter-spacing:.05em}
.btn{
display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;
padding:var(--s3) var(--s6);font-family:var(--heading);font-size:1rem;font-weight:600;
color:#fff;background:var(--accent);border:none;border-radius:var(--r-sm);cursor:pointer;
transition:background var(--fast) var(--ease),transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 16px rgba(217,119,87,.3)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.loading .btn-txt{visibility:hidden}
.btn.loading::after{content:'';position:absolute;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.msg{margin-top:var(--s5);padding:var(--s3) var(--s4);border-radius:var(--r-sm);font-size:.9rem;display:none;animation:fadeUp .3s var(--ease) both}
.msg.err{display:block;background:var(--err-bg);color:var(--err);border:1px solid rgba(192,69,58,.15)}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok);border:1px solid rgba(74,124,89,.15)}
.msg.info{display:block;background:rgba(217,119,87,.08);color:var(--accent-hover);border:1px solid rgba(217,119,87,.12)}
.result{margin-top:var(--s6);display:none;animation:fadeUp .5s var(--ease) both}
.result.show{display:block}
.frame{background:var(--raised);border-radius:var(--r-lg);padding:var(--s6);border:1px solid var(--border2);display:flex;flex-direction:column;align-items:center}
.img-wrp{width:100%;max-width:540px;margin:0 auto;border-radius:var(--r-md);overflow:hidden;background:var(--card);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.img-wrp img{display:block;width:100%;height:auto;border-radius:var(--r-md)}
.coup-info{margin-top:var(--s4);font-family:var(--heading);font-size:.75rem;font-weight:500;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
hr{border:none;border-top:1px solid var(--border2);margin:var(--s6) 0}
.foot{text-align:center;margin-top:var(--s12);padding-top:var(--s6);border-top:1px solid var(--border2);animation:fadeUp .8s var(--ease) .2s both}
.foot p{font-size:.8rem;color:var(--ink3)}
.foot a{color:var(--accent);text-decoration:none;font-weight:500;transition:color var(--fast) var(--ease)}
.foot a:hover{color:var(--accent-hover);text-decoration:underline}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.page{padding:var(--s6) var(--s4) var(--s10)}.card{padding:var(--s6);border-radius:var(--r-lg)}}
</style>
</head>
<body>
<div class="page">
<header class="header">
<h1>Redeem <span>Center</span></h1>
<p>Select your coupon coordinates, enter the redemption code, and claim your reward</p>
</header>
<div class="card">
<form id="frm" autocomplete="off">
<div class="form-group">
<label>Coupon Coordinates</label>
<div class="row">
<div class="sel-wrp"><select id="seqSel" required><option value="" disabled selected>Select Sequence</option></select></div>
<div class="sel-wrp"><select id="unitSel" required><option value="" disabled selected>Select Unit</option></select></div>
</div>
</div>
<div class="form-group">
<label>Redemption Code</label>
<input type="text" id="codeInp" class="code-input" placeholder="Enter your code, e.g. SLAGENT-VIP-2026" required autocomplete="off"/>
</div>
<hr/>
<button type="submit" class="btn" id="rBtn"><span class="btn-txt">Redeem Now</span></button>
<div class="msg" id="msgBox"><span id="msgIcon"></span><span id="msgTxt"></span></div>
<div class="result" id="resBox">
<div class="frame">
<div class="img-wrp"><img id="coupImg" src="" alt="Coupon"/></div>
<span class="coup-info" id="coupLbl"></span>
</div>
</div>
</form>
</div>
<footer class="foot">
<p><a href="https://github.com/DNTOF/DNTOF_Pages" target="_blank">DNT_OF Pages</a> &middot; Contact admin for issues</p>
</footer>
</div>

function xorDec(enc,code){
try{
var b=atob(enc),r='',cl=code.length;
for(var i=0;i<b.length;i++)r+=String.fromCharCode(b.charCodeAt(i)^code.charCodeAt(i%cl));
return r;
}catch(e){return null}
}
var sq=document.getElementById('seqSel'),un=document.getElementById('unitSel');
var ci=document.getElementById('codeInp'),rb=document.getElementById('rBtn');
var mb=document.getElementById('msgBox'),mi=document.getElementById('msgIcon'),mt=document.getElementById('msgTxt');
var rb2=document.getElementById('resBox'),ci2=document.getElementById('coupImg'),cl2=document.getElementById('coupLbl');

DATA.sequences.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=s;sq.appendChild(o)});
DATA.units.forEach(function(u,i){var o=document.createElement('option');o.value=i;o.textContent=u;un.appendChild(o)});

function msg(t,x){mb.className='msg '+t;var ic={err:'X',ok:'V',info:'i'};mi.textContent=ic[t]||'';mt.textContent=x}
function hideMsg(){mb.className='msg';mb.style.display='none'}
function hideRes(){rb2.classList.remove('show');ci2.src=''}

sq.addEventListener('change',hideRes);un.addEventListener('change',hideRes);
ci.addEventListener('input',function(){hideRes();hideMsg()});

document.getElementById('frm').addEventListener('submit',async function(e){
e.preventDefault();
var si=parseInt(sq.value),ui=parseInt(un.value),cd=ci.value.trim();
if(isNaN(si)||isNaN(ui)){msg('err','Please select complete coupon coordinates');return}
if(!cd){msg('err','Please enter redemption code');return}
var cp=DATA.coupons.find(function(c){return c.seq_idx===si&&c.unit_idx===ui});
if(!cp){msg('err','No coupon available at this coordinate');return}
rb.disabled=true;rb.classList.add('loading');hideMsg();hideRes();
await new Promise(function(r){setTimeout(r,500)});
try{
var d=xorDec(cp.encrypted,cd);
if(!d){msg('err','base64 decryption failed - check your code');rb.disabled=false;rb.classList.remove('loading');return}
var t='';
try{t=atob(d)}catch(e){msg('err','base64 decryption failed - check your code');rb.disabled=false;rb.classList.remove('loading');return}
if(t.indexOf('<svg')===-1&&t.indexOf('<SVG')===-1){msg('err','base64 decryption failed - check your code');rb.disabled=false;rb.classList.remove('loading');return}
ci2.onload=function(){cl2.textContent=cp.label;rb2.classList.add('show');msg('ok','Redemption successful! Your coupon is ready');rb.disabled=false;rb.classList.remove('loading')};
ci2.onerror=function(){msg('err','base64 decryption failed - check your code');rb.disabled=false;rb.classList.remove('loading')};
ci2.src='data:image/svg+xml;base64,'+d;
}catch(e){msg('err','base64 decryption failed - check your code');rb.disabled=false;rb.classList.remove('loading')}
});

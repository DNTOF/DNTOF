name: 生成文章索引

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/build-posts.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: posts-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史，用于读取文件修改时间）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描 Markdown 生成索引
        run: node scripts/build-posts.mjs

      - name: 索引有变化时提交
        id: commit
        run: |
          if git diff --quiet -- posts/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "索引没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/index.json
          git commit -m "chore: 更新文章索引 [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Pages 重新部署
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
